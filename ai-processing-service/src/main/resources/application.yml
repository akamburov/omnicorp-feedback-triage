server:
  port: 8081

spring:
  application:
    name: ai-processing-service

openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    model: ${GEMINI_API_MODEL:gemini-3.5-flash-lite}

management:
  endpoints:
    web:
      exposure:
        include: health,info
