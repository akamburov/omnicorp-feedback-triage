version: '3.8'

services:
  ai-processing-service:
    build:
      context: ./ai-processing-service
      dockerfile: Dockerfile
    container_name: omnicorp-ai-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_MODEL=${GEMINI_API_MODEL:-gemini-3.5-flash-lite}
    networks:
      - triage-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  submission-service:
    build:
      context: ./submission-service
      dockerfile: Dockerfile
    container_name: omnicorp-submission-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AI_SERVICE_URL=http://ai-processing-service:8081/api/v1/triage
    depends_on:
      ai-processing-service:
        condition: service_healthy
    networks:
      - triage-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnicorp-frontend
    ports:
      - "3000:80"
    depends_on:
      submission-service:
        condition: service_healthy
    networks:
      - triage-network

networks:
  triage-network:
    driver: bridge
